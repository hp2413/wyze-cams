<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: #0b1020;
        color: #e8ecff;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 14px 20px;
        background: #101828;
        border-bottom: 1px solid #1e2d50;
      }
      header h2 {
        margin: 0;
        font-size: 1rem;
        flex: 1;
        white-space: nowrap;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      button,
      select {
        background: #0f1430;
        color: #e8ecff;
        border: 1px solid #33407a;
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 0.85rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.active {
        background: #1e3a8a;
        border-color: #6495ed;
      }
      button.danger {
        border-color: #7a3333;
      }
      button.danger:hover {
        background: #3a1010;
      }
      #statusBar {
        padding: 6px 20px;
        font-size: 0.8rem;
        background: #0d1525;
        border-bottom: 1px solid #1e2d50;
        min-height: 28px;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: 12px;
        padding: 16px;
      }
      .cam-tile {
        background: #111827;
        border: 1px solid #1e2d50;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .cam-tile-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: #151c34;
        font-size: 0.82rem;
        min-height: 36px;
      }
      .cam-name {
        flex: 1;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cam-badge {
        font-size: 0.7rem;
        padding: 2px 7px;
        border-radius: 20px;
        white-space: nowrap;
      }
      .cam-vendor {
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 2px 6px;
        border-radius: 4px;
        text-transform: uppercase;
      }
      .vendor-wyze {
        background: #1e2a4a;
        color: #93c5fd;
      }
      .vendor-eufy {
        background: #3b2a4a;
        color: #d8b4fe;
      }
      #eufyBanner {
        display: none;
        margin: 12px 16px 0;
        padding: 12px 14px;
        background: #14102a;
        border: 1px solid #3b2a4a;
        border-radius: 10px;
        font-size: 0.82rem;
        color: #d8b4fe;
      }
      #eufyBanner.show {
        display: block;
      }
      #eufyBanner .eufy-auth-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      #eufyBanner img {
        max-height: 60px;
        background: #fff;
        border-radius: 6px;
      }
      #eufyBanner input {
        background: #0f1430;
        color: #e8ecff;
        border: 1px solid #33407a;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.95rem;
        letter-spacing: 1px;
        flex: 1;
        min-width: 160px;
      }
      #eufyBanner .eufy-err {
        color: #fca5a5;
        margin-top: 6px;
        min-height: 14px;
      }
      .badge-online {
        background: #14532d;
        color: #86efac;
      }
      .badge-offline {
        background: #3b0000;
        color: #fca5a5;
      }
      .badge-connecting {
        background: #1e3a00;
        color: #d9f99d;
      }
      .badge-streaming {
        background: #0c4a6e;
        color: #7dd3fc;
      }
      .badge-error {
        background: #450a0a;
        color: #fca5a5;
      }
      .cam-video-wrap {
        position: relative;
        background: #000;
        aspect-ratio: 16/9;
      }
      .cam-video-wrap video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .cam-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.85rem;
        color: #94a3b8;
        background: rgba(0, 0, 0, 0.55);
        pointer-events: none;
      }
      .cam-overlay.hidden {
        display: none;
      }
      .cam-thumb {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.35;
      }
      .cam-footer {
        display: flex;
        gap: 6px;
        padding: 6px 8px;
        background: #151c34;
        border-top: 1px solid #1e2d50;
        align-items: center;
      }
      .cam-footer button {
        padding: 5px 10px;
        font-size: 0.78rem;
      }
      .cam-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 6px 8px;
        background: #10182b;
        border-top: 1px solid #1e2d50;
      }
      .cam-controls button {
        padding: 5px 9px;
        font-size: 0.76rem;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .cam-controls button.on {
        background: #1e3a8a;
        border-color: #6495ed;
        color: #dbeafe;
      }
      .cam-controls button.talk-active {
        background: #7a1f1f;
        border-color: #ef4444;
        color: #fecaca;
      }
      .cam-controls .ctrl-sep {
        width: 1px;
        align-self: stretch;
        background: #1e2d50;
        margin: 0 2px;
      }
      .drag-handle {
        cursor: grab;
        color: #64748b;
        font-size: 1rem;
        user-select: none;
        padding: 0 2px;
      }
      .drag-handle:active {
        cursor: grabbing;
      }
      .expand-btn {
        padding: 3px 8px !important;
        font-size: 0.85rem;
      }
      .collapse-btn {
        padding: 0 !important;
        font-size: 0.85rem;
        width: 28px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .cam-tile.collapsed .cam-log,
      .cam-tile.collapsed .cam-controls {
        display: none;
      }
      .cam-tile.dragging {
        opacity: 0.4;
        outline: 2px dashed #6495ed;
      }
      .cam-tile.drop-target {
        outline: 2px solid #6495ed;
      }
      .cam-tile.expanded {
        grid-column: 1 / -1;
      }
      .cam-tile.expanded .cam-video-wrap {
        aspect-ratio: auto;
        height: 72vh;
      }
      .cam-log {
        font-size: 0.72rem;
        color: #64748b;
        padding: 4px 8px 6px;
        max-height: 56px;
        overflow-y: auto;
        font-family: monospace;
        line-height: 1.4;
      }
      .log-ok {
        color: #86efac;
      }
      .log-warn {
        color: #fde68a;
      }
      .log-err {
        color: #fca5a5;
      }
      #toasts {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 1000;
        max-width: 320px;
      }
      .toast {
        background: #1e293b;
        border: 1px solid #334155;
        border-left: 4px solid #38bdf8;
        border-radius: 8px;
        padding: 10px 12px;
        color: #e2e8f0;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        display: flex;
        gap: 10px;
        align-items: center;
        animation: toastIn 0.18s ease-out;
      }
      .toast img {
        width: 56px;
        height: 40px;
        object-fit: cover;
        border-radius: 4px;
        flex: none;
      }
      .toast .toast-title {
        font-weight: 600;
        font-size: 0.85rem;
      }
      .toast .toast-sub {
        font-size: 0.72rem;
        color: #94a3b8;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h2>📷 Camera Viewer</h2>
      <div class="toolbar">
        <button id="refreshBtn">↺ Refresh</button>
        <button id="snapshotAllBtn">📸 Snapshot All</button>
        <button id="startAllBtn">▶ Start All</button>
        <button id="stopAllBtn" class="danger">■ Stop All</button>
        <button id="expandAllBtn">▾ Expand All</button>
        <button id="substreamBtn">Sub-stream: OFF</button>
        <button id="alertsBtn">🔔 Browser Alerts: OFF</button>
      </div>
    </header>
    <div id="statusBar">Loading cameras…</div>
    <div id="eufyBanner"></div>
    <div id="grid"></div>
    <div id="toasts"></div>

    <script>
      let cameras = [];
      let useSubstream = false;
      const streams = new Map();

      const statusBar = document.getElementById("statusBar");
      const grid = document.getElementById("grid");
      const refreshBtn = document.getElementById("refreshBtn");
      const snapshotAllBtn = document.getElementById("snapshotAllBtn");
      const startAllBtn = document.getElementById("startAllBtn");
      const stopAllBtn = document.getElementById("stopAllBtn");
      const expandAllBtn = document.getElementById("expandAllBtn");
      const substreamBtn = document.getElementById("substreamBtn");
      const alertsBtn = document.getElementById("alertsBtn");
      const toasts = document.getElementById("toasts");

      substreamBtn.addEventListener("click", () => {
        useSubstream = !useSubstream;
        substreamBtn.textContent = `Sub-stream: ${useSubstream ? "ON" : "OFF"}`;
        substreamBtn.classList.toggle("active", useSubstream);
      });

      function b64Encode(value) {
        return btoa(unescape(encodeURIComponent(value)));
      }
      function b64Decode(value) {
        const norm = String(value || "")
          .replace(/-/g, "+")
          .replace(/_/g, "/");
        const padded = norm + "=".repeat((4 - (norm.length % 4)) % 4);
        return decodeURIComponent(escape(atob(padded)));
      }
      function parseSignalPayload(raw) {
        if (!raw || raw === "null") return null;
        const s = String(raw);
        for (const fn of [() => JSON.parse(s), () => JSON.parse(b64Decode(s))]) {
          try {
            return fn();
          } catch (_) {}
        }
        return null;
      }
      function escHtml(str) {
        return String(str).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
        );
      }

      class StreamSession {
        constructor(camera, elements) {
          this.camera = camera;
          this.els = elements;
          this.pc = null;
          this.ws = null;
          this.pendingCandidates = [];
          this.hasRemoteDesc = false;
          this.isApplyingRemoteAnswer = false;
          this.sessionToken = 0;
          this.startWaiters = [];
          this.incompatibleRetryCount = 0;
          this.wantTalk = false;
          this.localStream = null;
          this.remoteStream = null;
          this.muted = true;
          this.silentCtx = null;
        }

        // A muted, generated audio track so we can offer sendrecv audio without
        // asking for mic permission. The camera will only stream its audio back
        // on a session that also carries an audio m-line, so listen-only needs
        // *some* outgoing track here.
        _createSilentAudioTrack() {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          this.silentCtx = ctx;
          const oscillator = ctx.createOscillator();
          const dst = ctx.createMediaStreamDestination();
          oscillator.connect(dst);
          oscillator.start();
          const track = dst.stream.getAudioTracks()[0];
          track.enabled = false;
          return track;
        }

        log(msg, level = "") {
          const ts = new Date().toTimeString().slice(0, 8);
          const line = document.createElement("div");
          if (level) line.className = `log-${level}`;
          line.textContent = `[${ts}] ${msg}`;
          this.els.logEl.appendChild(line);
          this.els.logEl.scrollTop = this.els.logEl.scrollHeight;
        }

        setBadge(text, cls) {
          this.els.badge.textContent = text;
          this.els.badge.className = `cam-badge ${cls}`;
        }

        setOverlay(text) {
          if (text) {
            this.els.overlay.textContent = text;
            this.els.overlay.classList.remove("hidden");
          } else {
            this.els.overlay.classList.add("hidden");
          }
        }

        ensureThumbEl() {
          if (this.els.thumb) return this.els.thumb;
          const thumb = document.createElement("img");
          thumb.className = "cam-thumb";
          thumb.alt = "";
          this.els.video.parentElement.insertBefore(thumb, this.els.video);
          this.els.thumb = thumb;
          return thumb;
        }

        _resolveStartWaiters(value) {
          const waiters = this.startWaiters;
          this.startWaiters = [];
          for (const resolve of waiters) {
            resolve(value);
          }
        }

        _waitForStartResult(timeoutMs = 2500) {
          return new Promise((resolve) => {
            const timer = setTimeout(() => resolve(false), timeoutMs);
            this.startWaiters.push((value) => {
              clearTimeout(timer);
              resolve(value);
            });
          });
        }

        async start(isRetry = false) {
          this.stop();
          if (!isRetry) {
            this.incompatibleRetryCount = 0;
          }
          const sessionToken = ++this.sessionToken;
          if (!this.camera.online) {
            this.setBadge("Offline", "badge-offline");
            this.setOverlay("Camera offline");
            this._resolveStartWaiters(false);
            return;
          }
          this.setBadge("Connecting…", "badge-connecting");
          this.setOverlay("Fetching stream…");
          this.els.startBtn.disabled = true;

          if (this.wantTalk && !this.localStream) {
            try {
              this.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
              this.log("Mic acquired (experimental talk)", "warn");
            } catch (err) {
              this.log(`Mic denied: ${err.message}`, "err");
              this.wantTalk = false;
              this.els.talkBtn?.classList.remove("talk-active");
            }
          }

          try {
            const res = await fetch(
              `/api/stream-params?mac=${encodeURIComponent(this.camera.mac)}` +
                `&productModel=${encodeURIComponent(this.camera.productModel)}` +
                `&substream=${useSubstream}`
            );
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Failed to fetch stream params");
            this._connect(data.params.signalingUrl, data.params.iceServers, sessionToken);
            return await this._waitForStartResult();
          } catch (err) {
            this.log(err.message, "err");
            this.setBadge("Error", "badge-error");
            this.setOverlay("Failed: " + err.message);
            this.els.startBtn.disabled = false;
            this._resolveStartWaiters(false);
            return false;
          }
        }

        async refreshSnapshot() {
          try {
            this.log("Fetching snapshot…");
            const url = `/api/snapshot?mac=${encodeURIComponent(this.camera.mac)}&ts=${Date.now()}`;
            const res = await fetch(url);
            if (!res.ok) {
              const data = await res.json().catch(() => ({}));
              throw new Error(data.error || `HTTP ${res.status}`);
            }
            const source = res.headers.get("X-Snapshot-Source") || "cloud";
            this.ensureThumbEl().src = url;
            this.log(`Snapshot updated (${source})`, "ok");
          } catch (err) {
            this.log(`Snapshot error: ${err.message}`, "err");
          }
        }

        toggleMute() {
          this.muted = !this.muted;
          this.els.video.muted = this.muted;
          if (this.els.muteBtn) {
            this.els.muteBtn.textContent = this.muted ? "🔇 Muted" : "🔊 Sound";
            this.els.muteBtn.classList.toggle("on", !this.muted);
          }
        }

        async toggleTalk() {
          if (this.wantTalk) {
            this.wantTalk = false;
            this.els.talkBtn?.classList.remove("talk-active");
            this.log("Talk off — reconnecting receive-only");
          } else {
            this.wantTalk = true;
            this.els.talkBtn?.classList.add("talk-active");
            this.log("Talk on (experimental) — reconnecting", "warn");
          }
          if (this.camera.online) await this.start();
        }

        async control(action, btn) {
          if (btn) btn.disabled = true;
          try {
            this.log(`${action}…`);
            const res = await fetch("/api/camera/control", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                mac: this.camera.mac,
                productModel: this.camera.productModel,
                action,
              }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            this.log(`${action} ok`, "ok");
            return true;
          } catch (err) {
            this.log(`${action} failed: ${err.message}`, "err");
            return false;
          } finally {
            if (btn) btn.disabled = false;
          }
        }

        _connect(signalingUrl, iceServers, sessionToken) {
          this.log("Connecting…");
          this.pc = new RTCPeerConnection({ iceServers });

          this.pc.ontrack = (event) => {
            if (sessionToken !== this.sessionToken) return;
            this.log(`Track arrived: ${event.track.kind}`, "ok");
            if (!this.remoteStream) this.remoteStream = new MediaStream();
            this.remoteStream.addTrack(event.track);
            this.els.video.srcObject = this.remoteStream;
            this.els.video.muted = this.muted;
            if (event.track.kind === "video") {
              this.setOverlay(null);
              this.setBadge("● Live", "badge-streaming");
              this._resolveStartWaiters(true);
            }
          };

          this.pc.onicecandidate = (event) => {
            if (sessionToken !== this.sessionToken) return;
            if (event.candidate) this._send("ICE_CANDIDATE", event.candidate, "MASTER");
          };

          this.pc.onconnectionstatechange = () => {
            if (sessionToken !== this.sessionToken) return;
            const s = this.pc?.connectionState;
            if (s === "failed" || s === "disconnected") {
              this.log(`Connection ${s}`, "warn");
              this.setBadge(s === "failed" ? "Error" : "Disconnected", "badge-error");
              this._resolveStartWaiters(false);
            }
          };

          this.pc.addTransceiver("video", { direction: "recvonly" });

          // The Wyze camera's SDP answer expects bidirectional audio: a
          // recvonly audio m-line makes it answer "send", which the browser
          // rejects ("incompatible send direction"). So always negotiate
          // sendrecv audio — with the live mic when talk is on, otherwise a
          // muted silent track. The camera streams its audio back on that same
          // m-line, so unmuting lets you hear it without needing mic access.
          const micTrack = this.wantTalk && this.localStream
            ? this.localStream.getAudioTracks()[0]
            : null;
          const audioTrack = micTrack || this._createSilentAudioTrack();
          this.pc.addTransceiver(audioTrack, { direction: "sendrecv" });

          this.ws = new WebSocket(signalingUrl);

          this.ws.onopen = async () => {
            if (sessionToken !== this.sessionToken || !this.pc) return;
            this.log("Signaling connected", "ok");
            this.setOverlay("Negotiating…");
            const offer = await this.pc.createOffer();
            await this.pc.setLocalDescription(offer);
            this._send("SDP_OFFER", offer, "MASTER");
          };

          this.ws.onmessage = async (event) => {
            if (sessionToken !== this.sessionToken || !this.pc) return;
            if (typeof event.data !== "string" || event.data.length === 0) return;
            try {
              const env = JSON.parse(event.data);
              const type = env.messageType || env.action;
              const payload = parseSignalPayload(env.messagePayload);
              if (!payload) return;

              if (type === "SDP_ANSWER") {
                if (
                  this.hasRemoteDesc ||
                  this.isApplyingRemoteAnswer ||
                  this.pc.signalingState !== "have-local-offer"
                ) {
                  this.log("Ignoring late SDP answer", "warn");
                  return;
                }
                this.isApplyingRemoteAnswer = true;
                try {
                  await this.pc.setRemoteDescription(new RTCSessionDescription(payload));
                  this.hasRemoteDesc = true;
                  this.log("SDP answer");
                  for (const c of this.pendingCandidates) await this.pc.addIceCandidate(c);
                  this.pendingCandidates = [];
                } catch (err) {
                  if (
                    String(err?.message || "")
                      .toLowerCase()
                      .includes("incompatible send direction")
                  ) {
                    this.log("Incompatible SDP answer", "warn");
                    this._resolveStartWaiters(false);

                    if (this.incompatibleRetryCount < 1) {
                      this.incompatibleRetryCount += 1;
                      this.log("Retrying negotiation…", "warn");
                      setTimeout(() => {
                        if (sessionToken !== this.sessionToken) return;
                        this.start(true).catch(() => {});
                      }, 500);
                    } else {
                      this.setBadge("Error", "badge-error");
                      this.setOverlay("Incompatible SDP from camera");
                      this.els.startBtn.disabled = false;
                    }
                    return;
                  }
                  throw err;
                } finally {
                  this.isApplyingRemoteAnswer = false;
                }
              }
              if (type === "ICE_CANDIDATE") {
                const c = new RTCIceCandidate(payload);
                if (!this.hasRemoteDesc) this.pendingCandidates.push(c);
                else if (this.pc.remoteDescription) await this.pc.addIceCandidate(c);
              }
            } catch (err) {
              this.log(`Signal error: ${err.message}`, "err");
              this._resolveStartWaiters(false);
            }
          };

          this.ws.onerror = () => this.log("WebSocket error", "err");
          this.ws.onclose = (e) => {
            if (sessionToken !== this.sessionToken) return;
            if (e.code !== 1000) this.log(`WS closed (${e.code})`, "warn");
            this._resolveStartWaiters(false);
          };
        }

        _send(action, payload, recipientClientId = "") {
          if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
          this.ws.send(
            JSON.stringify({
              action,
              messagePayload: b64Encode(JSON.stringify(payload)),
              recipientClientId,
            })
          );
        }

        stop() {
          this.sessionToken += 1;
          this.pendingCandidates = [];
          this.hasRemoteDesc = false;
          this.isApplyingRemoteAnswer = false;
          if (this.ws) {
            this.ws.close();
            this.ws = null;
          }
          if (this.pc) {
            this.pc.getSenders().forEach((s) => s.track?.stop());
            this.pc.getReceivers().forEach((r) => r.track?.stop());
            this.pc.close();
            this.pc = null;
          }
          if (this.localStream) {
            this.localStream.getTracks().forEach((t) => t.stop());
            this.localStream = null;
          }
          if (this.silentCtx) {
            this.silentCtx.close().catch(() => {});
            this.silentCtx = null;
          }
          this.remoteStream = null;
          this.els.video.srcObject = null;
          this.setBadge(
            this.camera.online ? "Online" : "Offline",
            this.camera.online ? "badge-online" : "badge-offline"
          );
          this.setOverlay(this.camera.online ? "Click Start" : "Camera offline");
          this.els.startBtn.disabled = !this.camera.online;
          this._resolveStartWaiters(false);
        }
      }

      let draggedTile = null;

      function saveOrder() {
        const order = [...grid.children].map((t) => t.dataset.mac);
        try {
          localStorage.setItem("wyzeTileOrder", JSON.stringify(order));
        } catch (_) {}
      }

      function applySavedOrder() {
        let order = [];
        try {
          order = JSON.parse(localStorage.getItem("wyzeTileOrder") || "[]");
        } catch (_) {}
        for (const mac of order) {
          const tile = grid.querySelector(`.cam-tile[data-mac="${CSS.escape(mac)}"]`);
          if (tile) grid.appendChild(tile);
        }
      }

      function attachDragHandlers(tile) {
        tile.addEventListener("dragstart", (e) => {
          // Don't start a drag from a button — let clicks work normally.
          if (e.target.closest("button")) {
            e.preventDefault();
            return;
          }
          draggedTile = tile;
          tile.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          try {
            e.dataTransfer.setData("text/plain", tile.dataset.mac);
          } catch (_) {}
        });

        tile.addEventListener("dragend", () => {
          tile.classList.remove("dragging");
          grid.querySelectorAll(".drop-target").forEach((t) => t.classList.remove("drop-target"));
          draggedTile = null;
          saveOrder();
        });

        tile.addEventListener("dragover", (e) => {
          if (!draggedTile || draggedTile === tile) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          const rect = tile.getBoundingClientRect();
          const after = e.clientX - rect.left > rect.width / 2;
          if (after) tile.after(draggedTile);
          else tile.before(draggedTile);
        });

        tile.addEventListener("dragenter", () => {
          if (draggedTile && draggedTile !== tile) tile.classList.add("drop-target");
        });
        tile.addEventListener("dragleave", () => tile.classList.remove("drop-target"));
      }

      function buildGrid(cameraList) {
        // Preserve Eufy tiles + their sessions — only rebuild Wyze tiles. Eufy
        // tiles arrive from a separate async path (pollEufyAuth → loadEufyCameras)
        // that can race with this one; wiping the whole grid drops them.
        for (const tile of grid.querySelectorAll('.cam-tile:not([data-vendor="eufy"])')) {
          const mac = tile.dataset.mac;
          const session = streams.get(mac);
          if (session) {
            session.stop();
            streams.delete(mac);
          }
          tile.remove();
        }

        for (const camera of cameraList) {
          const tile = document.createElement("div");
          tile.className = "cam-tile collapsed";
          tile.draggable = true;
          tile.dataset.mac = camera.mac;
          tile.dataset.vendor = "wyze";
          tile.innerHTML = `
            <div class="cam-tile-header">
              <span class="drag-handle" title="Drag to reorder">⠿</span>
              <span class="cam-name">${escHtml(camera.nickname)}</span>
              <span class="cam-vendor vendor-wyze">Wyze</span>
              <span class="cam-badge ${camera.online ? "badge-online" : "badge-offline"}">
                ${camera.online ? "Online" : "Offline"}
              </span>
              <button class="collapse-btn" title="Show / hide controls">▾</button>
              <button class="expand-btn" title="Expand / collapse">⛶</button>
            </div>
            <div class="cam-video-wrap">
              ${
                camera.thumbnail
                  ? `<img class="cam-thumb" src="/api/thumbnail?url=${encodeURIComponent(camera.thumbnail)}" alt="" />`
                  : ""
              }
              <video autoplay playsinline muted></video>
              <div class="cam-overlay">${camera.online ? "Click Start" : "Camera offline"}</div>
            </div>
            <div class="cam-log"></div>
            <div class="cam-controls">
              <button class="start-btn" ${camera.online ? "" : "disabled"}>▶ Start</button>
              <button class="stop-btn">■ Stop</button>
              <span class="ctrl-sep"></span>
              <button class="mute-btn">🔇 Muted</button>
              <button class="snap-btn" title="Capture frame from live view">📸 Snap</button>
              <span class="ctrl-sep"></span>
              ${
                camera.productModel === "HL_CAM4"
                  ? ""
                  : `<button class="toggle-btn" data-on="spotlight_on" data-off="spotlight_off"
                      data-label-on="🔦 Spot Off" data-label-off="🔦 Spot">🔦 Spot</button>`
              }
              <button class="toggle-btn" data-on="siren_on" data-off="siren_off"
                data-label-on="🚨 Siren Off" data-label-off="🚨 Siren">🚨 Siren</button>
              <span class="ctrl-sep"></span>
              <button class="toggle-btn" data-on="notifications_on" data-off="notifications_off"
                data-label-on="🔔 Notify Off" data-label-off="🔔 Notify">🔔 Notify</button>
            </div>`;

          grid.appendChild(tile);

          const els = {
            video: tile.querySelector("video"),
            thumb: tile.querySelector(".cam-thumb"),
            overlay: tile.querySelector(".cam-overlay"),
            badge: tile.querySelector(".cam-badge"),
            logEl: tile.querySelector(".cam-log"),
            startBtn: tile.querySelector(".start-btn"),
            stopBtn: tile.querySelector(".stop-btn"),
            muteBtn: tile.querySelector(".mute-btn"),
          };

          const session = new StreamSession(camera, els);
          streams.set(camera.mac, session);

          els.startBtn.addEventListener("click", () => session.start());
          els.stopBtn.addEventListener("click", () => session.stop());
          els.muteBtn.addEventListener("click", () => session.toggleMute());
          tile.querySelector(".snap-btn").addEventListener("click", () => captureFromVideo(session));

          tile.querySelector(".expand-btn").addEventListener("click", () => {
            const expanding = !tile.classList.contains("expanded");
            tile.classList.toggle("expanded", expanding);
            if (expanding) {
              grid.prepend(tile);
              tile.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });

          tile.querySelector(".collapse-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            const btn = e.currentTarget;
            const collapsed = tile.classList.toggle("collapsed");
            btn.textContent = collapsed ? "▾" : "▴";
          });

          attachDragHandlers(tile);

          for (const btn of tile.querySelectorAll(".toggle-btn")) {
            btn.dataset.state = "off";
            btn.addEventListener("click", async () => {
              const turningOn = btn.dataset.state === "off";
              const action = turningOn ? btn.dataset.on : btn.dataset.off;
              const ok = await session.control(action, btn);
              if (!ok) return;
              btn.dataset.state = turningOn ? "on" : "off";
              btn.classList.toggle("on", turningOn);
              btn.textContent = turningOn ? btn.dataset.labelOn : btn.dataset.labelOff;
            });
          }
        }

        applySavedOrder();
      }

      async function loadCameras() {
        statusBar.textContent = "Loading cameras…";
        const res = await fetch("/api/cameras");
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load cameras");
        cameras = data.cameras;
        buildGrid(cameras);
        const online = cameras.filter((c) => c.online).length;
        statusBar.textContent = `${cameras.length} cameras — ${online} online`;
      }

      // When the server reports AUTO_START_STREAMS (set in docker-compose for the
      // deployed container build), start every online Wyze tile sequentially so
      // the page renders live video without the user clicking "Start All".
      // Eufy tiles are intentionally skipped — they need P2P which doesn't run
      // in the container and they remain manual-start by design.
      let autoStartTriggered = false;
      async function maybeAutoStartWyze() {
        if (autoStartTriggered) return;
        try {
          const res = await fetch("/api/config");
          if (!res.ok) return;
          const cfg = await res.json();
          if (!cfg.autoStartStreams) return;
        } catch {
          return;
        }
        autoStartTriggered = true;
        for (const tile of grid.querySelectorAll('.cam-tile:not([data-vendor="eufy"])')) {
          const session = streams.get(tile.dataset.mac);
          if (!session || !session.camera.online) continue;
          await session.start();
          await new Promise((resolve) => setTimeout(resolve, 1000));
        }
      }

      refreshBtn.addEventListener("click", async () => {
        try {
          await loadCameras();
          // loadCameras() rebuilds the grid (wiping Eufy tiles too), so re-add
          // Eufy cameras if that side is already connected.
          window.reloadEufy?.();
        } catch (err) {
          statusBar.textContent = "Error: " + err.message;
        }
      });

      function captureFromVideo(session) {
        const video = session.els.video;
        const name = session.camera.nickname || session.camera.name || "camera";
        if (!video || !video.videoWidth || !video.videoHeight) {
          session.log?.("No live frame — start the stream first", "warn");
          return false;
        }
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        try {
          canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
        } catch (err) {
          session.log?.(`Capture failed: ${err.message}`, "err");
          return false;
        }
        canvas.toBlob((blob) => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          const safe = String(name).replace(/[^a-z0-9_-]+/gi, "_");
          a.download = `${safe}-${Date.now()}.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }, "image/png");
        session.log?.(`Snapshot saved (${canvas.width}×${canvas.height})`, "ok");
        return true;
      }

      snapshotAllBtn.addEventListener("click", () => {
        let delay = 0;
        for (const session of streams.values()) {
          setTimeout(() => captureFromVideo(session), delay);
          delay += 150;
        }
      });

      startAllBtn.addEventListener("click", async () => {
        for (const session of streams.values()) {
          if (!session.camera.online) continue;
          await session.start();
          await new Promise((resolve) => setTimeout(resolve, 1000));
        }
      });

      stopAllBtn.addEventListener("click", () => streams.forEach((s) => s.stop()));

      let allExpanded = false;
      expandAllBtn.addEventListener("click", () => {
        allExpanded = !allExpanded;
        for (const tile of grid.querySelectorAll(".cam-tile")) {
          tile.classList.toggle("collapsed", !allExpanded);
          const btn = tile.querySelector(".collapse-btn");
          if (btn) btn.textContent = allExpanded ? "▴" : "▾";
        }
        expandAllBtn.textContent = allExpanded ? "▴ Collapse All" : "▾ Expand All";
        expandAllBtn.classList.toggle("active", allExpanded);
      });

      // --- Event notifications -------------------------------------------
      // Wyze cloud push only reaches the phone app, so to get alerts in the
      // browser we poll /api/events and raise notifications + toasts locally.
      let alertsOn = false;
      let eventsSince = Date.now();
      let eventPollTimer = null;
      const seenEvents = new Set();
      const EVENT_POLL_MS = 10000;
      const EVENT_LABELS = {
        1: "Motion",
        2: "Sound",
        10: "Person",
        12: "Vehicle",
        13: "Person",
        15: "Pet",
      };

      function eventLabel(ev) {
        if (ev.tags && ev.tags.length) return ev.tags.join(", ");
        return EVENT_LABELS[ev.value] || "Motion";
      }

      function thumbProxy(url) {
        return url ? `/api/thumbnail?url=${encodeURIComponent(url)}` : null;
      }

      function focusCamera(mac) {
        const tile = grid.querySelector(`[data-mac="${mac}"]`);
        if (tile) tile.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      function showToast(title, sub, ev) {
        const toast = document.createElement("div");
        toast.className = "toast";
        const thumb = thumbProxy(ev.thumbnail);
        toast.innerHTML = `
          ${thumb ? `<img src="${thumb}" alt="" />` : ""}
          <div>
            <div class="toast-title">${escHtml(title)}</div>
            <div class="toast-sub">${escHtml(sub)}</div>
          </div>`;
        toast.addEventListener("click", () => {
          focusCamera(ev.mac);
          toast.remove();
        });
        toasts.appendChild(toast);
        setTimeout(() => toast.remove(), 8000);
      }

      function handleEvent(ev) {
        const label = eventLabel(ev);
        const when = new Date(ev.time).toLocaleTimeString();
        const title = `${label} — ${ev.nickname}`;

        if ("Notification" in window && Notification.permission === "granted") {
          const n = new Notification(title, {
            body: when,
            icon: thumbProxy(ev.thumbnail) || undefined,
            tag: ev.id,
          });
          n.onclick = () => {
            window.focus();
            focusCamera(ev.mac);
            n.close();
          };
        }

        const session = streams.get(ev.mac);
        if (session) session.log(`🔔 ${label} @ ${when}`, "");

        showToast(title, when, ev);
      }

      async function pollEvents() {
        try {
          const res = await fetch(`/api/events?since=${eventsSince}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "events fetch failed");
          const events = (data.events || []).sort((a, b) => a.time - b.time);
          for (const ev of events) {
            if (seenEvents.has(ev.id)) continue;
            seenEvents.add(ev.id);
            if (ev.time > eventsSince) eventsSince = ev.time;
            handleEvent(ev);
          }
        } catch (err) {
          statusBar.textContent = "Events error: " + err.message;
        }
      }

      // Per-browser preference. Defaults to ON: alerts run unless the user has
      // explicitly turned them off in this browser.
      const ALERTS_PREF_KEY = "wyzeBrowserAlerts";
      function alertsEnabledPref() {
        try {
          return localStorage.getItem(ALERTS_PREF_KEY) !== "off";
        } catch {
          return true;
        }
      }
      function setAlertsPref(on) {
        try {
          localStorage.setItem(ALERTS_PREF_KEY, on ? "on" : "off");
        } catch {
          /* ignore unavailable storage */
        }
      }

      function startAlerts() {
        if (alertsOn) return;
        alertsOn = true;
        eventsSince = Date.now();
        alertsBtn.textContent = "🔔 Browser Alerts: ON";
        alertsBtn.classList.add("active");
        pollEvents();
        eventPollTimer = setInterval(pollEvents, EVENT_POLL_MS);
      }
      function stopAlerts() {
        alertsOn = false;
        clearInterval(eventPollTimer);
        eventPollTimer = null;
        alertsBtn.textContent = "🔔 Browser Alerts: OFF";
        alertsBtn.classList.remove("active");
      }

      alertsBtn.addEventListener("click", async () => {
        if (alertsOn) {
          setAlertsPref(false);
          stopAlerts();
          return;
        }
        setAlertsPref(true);
        if ("Notification" in window && Notification.permission === "default") {
          await Notification.requestPermission();
        }
        if ("Notification" in window && Notification.permission === "denied") {
          statusBar.textContent =
            "OS/browser notifications are blocked — showing in-page toasts only.";
        }
        startAlerts();
      });

      loadCameras()
        .then(() => maybeAutoStartWyze())
        .catch((err) => {
          statusBar.textContent = "Error: " + err.message;
        });

      // Default ON for each browser unless the user previously turned it off.
      if (alertsEnabledPref()) {
        // A permission prompt needs a user gesture, so we can't force the OS
        // dialog on load; if already granted we use OS notifications, otherwise
        // in-page toasts run until the user clicks the button to grant.
        startAlerts();
      } else {
        stopAlerts();
      }

      // ====================================================================
      // Eufy cameras
      // --------------------------------------------------------------------
      // Eufy cams don't speak WebRTC; the sibling eufy/server.js process logs
      // into the Eufy cloud, opens a P2P session, and pushes MPEG-TS over a
      // WebSocket. This page only talks to its own origin — cam-frontend's
      // server proxies the Eufy HTTP API (/api/eufy/*) and the video socket
      // (/eufy-stream) through to that process. Eufy tiles live in the same
      // grid as Wyze tiles, keyed in the shared `streams` map by serial.
      // ====================================================================
      const eufyBanner = document.getElementById("eufyBanner");
      let eufyConnected = false;
      let eufyLoaded = false;

      class EufyStreamSession {
        constructor(camera, els) {
          this.camera = camera;
          this.els = els;
          this.player = null;
          this.muted = true;
          this.autoStarted = false;
          this.autoStopTimer = null;
        }

        log(msg, level = "") {
          const ts = new Date().toTimeString().slice(0, 8);
          const line = document.createElement("div");
          if (level) line.className = `log-${level}`;
          line.textContent = `[${ts}] ${msg}`;
          this.els.logEl.appendChild(line);
          this.els.logEl.scrollTop = this.els.logEl.scrollHeight;
        }

        setBadge(text, cls) {
          this.els.badge.textContent = text;
          this.els.badge.className = `cam-badge ${cls}`;
        }

        setOverlay(text) {
          if (text) {
            this.els.overlay.textContent = text;
            this.els.overlay.classList.remove("hidden");
          } else {
            this.els.overlay.classList.add("hidden");
          }
        }

        start() {
          if (!window.mpegts || !mpegts.isSupported()) {
            this.log("MSE / mpegts.js not supported in this browser", "err");
            this.setOverlay("Browser unsupported");
            return;
          }
          this.stop();
          this.setBadge("Connecting…", "badge-connecting");
          this.setOverlay("Starting livestream…");
          this.log("Connecting…");

          const proto = location.protocol === "https:" ? "wss" : "ws";
          const url = `${proto}://${location.host}/eufy-stream?sn=${encodeURIComponent(this.camera.sn)}`;

          this.player = mpegts.createPlayer(
            { type: "mpegts", isLive: true, url },
            {
              enableWorker: true,
              liveBufferLatencyChasing: true,
              liveBufferLatencyMaxLatency: 2.0,
              liveBufferLatencyMinRemain: 0.5,
            }
          );
          this.player.attachMediaElement(this.els.video);
          this.els.video.muted = this.muted;

          this.player.on(mpegts.Events.ERROR, (type, detail) => {
            this.log(`Stream error: ${type} ${detail}`, "err");
            this.setBadge("Error", "badge-error");
            this.setOverlay(`Error: ${detail}`);
          });
          this.els.video.addEventListener(
            "playing",
            () => {
              this.setOverlay(null);
              this.setBadge("● Live", "badge-streaming");
              this.log("Streaming", "ok");
            },
            { once: true }
          );

          this.player.load();
          this.player.play().catch((err) => this.log(`play() failed: ${err.message}`, "err"));
        }

        stop() {
          clearTimeout(this.autoStopTimer);
          this.autoStopTimer = null;
          this.autoStarted = false;
          if (this.player) {
            try { this.player.pause(); } catch (_) {}
            try { this.player.unload(); } catch (_) {}
            try { this.player.detachMediaElement(); } catch (_) {}
            try { this.player.destroy(); } catch (_) {}
            this.player = null;
          }
          this.els.video.removeAttribute("src");
          this.setBadge(
            this.camera.online ? "Online" : "Offline",
            this.camera.online ? "badge-online" : "badge-offline"
          );
          this.setOverlay(this.camera.online ? "Click Start" : "Camera offline");
        }

        toggleMute() {
          this.muted = !this.muted;
          this.els.video.muted = this.muted;
          if (this.els.muteBtn) {
            this.els.muteBtn.textContent = this.muted ? "🔇 Muted" : "🔊 Sound";
            this.els.muteBtn.classList.toggle("on", !this.muted);
          }
        }

        // A detection fired: pop the live view for `ms`, then stop — but leave a
        // manually-started stream running.
        autoCapture(ms) {
          if (this.player && !this.autoStarted) {
            this.log("👤 Person detected (already streaming)", "warn");
            return;
          }
          if (!this.player) this.start();
          this.autoStarted = true;
          clearTimeout(this.autoStopTimer);
          this.autoStopTimer = setTimeout(() => this.stop(), ms);
          this.log(`👤 Person detected — auto-streaming ${ms / 1000}s`, "warn");
        }
      }

      function removeEufyTiles() {
        for (const tile of grid.querySelectorAll('.cam-tile[data-vendor="eufy"]')) {
          const sn = tile.dataset.mac;
          const session = streams.get(sn);
          if (session) {
            session.stop();
            streams.delete(sn);
          }
          tile.remove();
        }
      }

      function buildEufyTiles(cameras) {
        removeEufyTiles();
        for (const camera of cameras) {
          const tile = document.createElement("div");
          tile.className = "cam-tile collapsed";
          tile.draggable = true;
          tile.dataset.mac = camera.sn; // shared ordering key (unique per cam)
          tile.dataset.vendor = "eufy";
          tile.innerHTML = `
            <div class="cam-tile-header">
              <span class="drag-handle" title="Drag to reorder">⠿</span>
              <span class="cam-name">${escHtml(camera.name)}</span>
              <span class="cam-vendor vendor-eufy">Eufy</span>
              <span class="cam-badge ${camera.online ? "badge-online" : "badge-offline"}">
                ${camera.online ? "Online" : "Offline"}
              </span>
              <button class="collapse-btn" title="Show / hide controls">▾</button>
              <button class="expand-btn" title="Expand / collapse">⛶</button>
            </div>
            <div class="cam-video-wrap">
              <video autoplay playsinline muted></video>
              <div class="cam-overlay">${camera.online ? "Click Start" : "Camera offline"}</div>
            </div>
            <div class="cam-log"></div>
            <div class="cam-controls">
              <button class="start-btn">▶ Start</button>
              <button class="stop-btn">■ Stop</button>
              <span class="ctrl-sep"></span>
              <button class="mute-btn">🔇 Muted</button>
              <button class="snap-btn" title="Capture frame from live view">📸 Snap</button>
            </div>`;
          grid.appendChild(tile);

          const els = {
            video: tile.querySelector("video"),
            overlay: tile.querySelector(".cam-overlay"),
            badge: tile.querySelector(".cam-badge"),
            logEl: tile.querySelector(".cam-log"),
            muteBtn: tile.querySelector(".mute-btn"),
          };
          const session = new EufyStreamSession(camera, els);
          streams.set(camera.sn, session);

          tile.querySelector(".start-btn").addEventListener("click", () => session.start());
          tile.querySelector(".stop-btn").addEventListener("click", () => session.stop());
          els.muteBtn.addEventListener("click", () => session.toggleMute());
          tile.querySelector(".snap-btn").addEventListener("click", () => captureFromVideo(session));
          tile.querySelector(".expand-btn").addEventListener("click", () => {
            const expanding = !tile.classList.contains("expanded");
            tile.classList.toggle("expanded", expanding);
            if (expanding) {
              grid.prepend(tile);
              tile.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
          tile.querySelector(".collapse-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            const btn = e.currentTarget;
            const collapsed = tile.classList.toggle("collapsed");
            btn.textContent = collapsed ? "▾" : "▴";
          });
          attachDragHandlers(tile);
        }
        applySavedOrder();
      }

      let eufyCamRetry = null;
      async function loadEufyCameras() {
        clearTimeout(eufyCamRetry);
        try {
          const res = await fetch("/api/eufy/cameras");
          const data = await res.json();
          if (res.status === 503) {
            // Cloud session not fully up yet — retry shortly.
            eufyCamRetry = setTimeout(() => loadEufyCameras().catch(() => {}), 3000);
            return;
          }
          if (!res.ok) throw new Error(data.error || "Failed to load Eufy cameras");
          eufyLoaded = true;
          buildEufyTiles(data.cameras || []);
        } catch (err) {
          eufyBanner.classList.add("show");
          eufyBanner.innerHTML = `Eufy: ${escHtml(err.message)}`;
        }
      }

      // Expose for the Refresh button, which rebuilds the grid (wiping Eufy
      // tiles); re-add them if the Eufy side is connected.
      window.reloadEufy = () => {
        if (eufyConnected) loadEufyCameras().catch(() => {});
      };

      // --- Eufy auth (captcha / 2FA) shown inline in the banner --------------
      let eufyAuthTimer = null;
      let eufyAuthSig = ""; // re-render the banner only when the challenge changes

      function renderEufyBanner(data) {
        const sig = `${data.status}|${data.message || ""}`;
        if (sig === eufyAuthSig) return; // don't clobber what the user is typing
        eufyAuthSig = sig;

        eufyBanner.classList.add("show");
        const isCaptcha = data.status === "captcha";
        const isTfa = data.status === "tfa";

        if (isCaptcha || isTfa) {
          eufyBanner.innerHTML = `
            <strong>Eufy login —</strong> ${escHtml(data.message || (isCaptcha ? "Enter the captcha." : "Enter the 2FA code."))}
            <div class="eufy-auth-row">
              ${isCaptcha && data.captcha ? `<img src="${data.captcha}" alt="captcha" />` : ""}
              <input id="eufyAuthInput" autocomplete="one-time-code" autocapitalize="off"
                spellcheck="false" placeholder="Enter code" />
              <button id="eufyAuthSubmit">Submit</button>
            </div>
            <div class="eufy-err" id="eufyAuthErr"></div>`;
          const input = eufyBanner.querySelector("#eufyAuthInput");
          input.focus();
          eufyBanner.querySelector("#eufyAuthSubmit").addEventListener("click", submitEufyAuth);
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") submitEufyAuth();
          });
        } else if (data.status === "error") {
          eufyBanner.innerHTML = `<strong>Eufy login failed:</strong> ${escHtml(data.message || "")}`;
        } else {
          eufyBanner.innerHTML = `Eufy: ${escHtml(data.message || "Connecting…")}`;
        }
      }

      async function submitEufyAuth() {
        const input = eufyBanner.querySelector("#eufyAuthInput");
        const errEl = eufyBanner.querySelector("#eufyAuthErr");
        const code = (input?.value || "").trim();
        if (!code) return;
        if (errEl) errEl.textContent = "";
        input.disabled = true;
        try {
          const res = await fetch("/api/eufy/auth/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code }),
          });
          const data = await res.json();
          if (!res.ok && errEl) errEl.textContent = data.error || "Submit failed.";
        } catch (err) {
          if (errEl) errEl.textContent = err.message;
        }
        eufyAuthSig = ""; // force a re-render on the next poll
        pollEufyAuth();
      }

      async function pollEufyAuth() {
        clearTimeout(eufyAuthTimer);
        let data;
        try {
          const res = await fetch("/api/eufy/auth/status");
          data = await res.json();
          if (res.status === 502) {
            // The Eufy viewer process isn't running.
            eufyBanner.classList.add("show");
            eufyBanner.innerHTML = `Eufy server not reachable — start it with <code>node server.js</code> in the <code>eufy/</code> folder.`;
            eufyAuthSig = "";
            eufyAuthTimer = setTimeout(pollEufyAuth, 5000);
            return;
          }
        } catch (_) {
          eufyAuthTimer = setTimeout(pollEufyAuth, 4000);
          return;
        }

        if (data.connected || data.status === "connected") {
          eufyConnected = true;
          eufyBanner.classList.remove("show");
          eufyAuthSig = "";
          if (!eufyLoaded) loadEufyCameras().catch(() => {});
          return; // stop polling once connected
        }

        renderEufyBanner(data);
        // Keep polling so a freshly re-issued captcha (new image) is picked up.
        eufyAuthTimer = setTimeout(pollEufyAuth, data.status === "connecting" ? 1500 : 4000);
      }

      // --- Eufy detection events: auto-pop the live view on a person ---------
      const EUFY_AUTO_CAPTURE_MS = 5000;
      function initEufyEventStream() {
        if (!window.EventSource) return;
        const es = new EventSource("/api/eufy/events");
        es.onmessage = (e) => {
          let evt;
          try {
            evt = JSON.parse(e.data);
          } catch (_) {
            return;
          }
          if (evt.type === "person") {
            const session = streams.get(evt.sn);
            if (session && typeof session.autoCapture === "function") {
              session.autoCapture(EUFY_AUTO_CAPTURE_MS);
            }
          }
        };
        es.onerror = () => {}; // EventSource auto-reconnects
      }

      pollEufyAuth();
      initEufyEventStream();
    </script>
  </body>
</html>
